name: Deploy

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      environment:
        required: true
        type: string
      version:
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy environment
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: deployment-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.environment == 'prod' && '0' || '1' }}
          persist-credentials: false
      - name: Request deployment
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_VERSION: ${{ inputs.version }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ACCOUNT: ${{ vars.DEPLOY_ACCOUNT }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/deploy.sh "$DEPLOY_ENVIRONMENT" "$IMAGE_VERSION"
