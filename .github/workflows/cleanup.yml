name: GHCR Cleanup

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview deletions without removing images
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    name: Clean untagged images (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        package: [talqo, talqo-docs]
    concurrency:
      group: ghcr-cleanup-${{ matrix.package }}
      cancel-in-progress: false
    steps:
      - name: Delete old untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package }}
          exclude-tags: "*"
          delete-untagged: "true"
          older-than: 7 days
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
