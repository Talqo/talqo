name: Publish images

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
    outputs:
      talqo-digest:
        value: ${{ jobs.talqo.outputs.digest }}
      docs-digest:
        value: ${{ jobs.docs.outputs.digest }}

permissions:
  contents: read

jobs:
  talqo:
    name: Publish Talqo
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.version == 'dev' && '1' || '0' }}
          persist-credentials: false
      - name: Recheck release order
        if: inputs.version != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh validate "$RELEASE_VERSION"
      - name: Image repository
        id: repository
        env:
          OWNER: ${{ github.repository_owner }}
        run: printf 'image=ghcr.io/%s/talqo\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publish
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.repository.outputs.image }}
          file: Dockerfile
          version: ${{ inputs.version }}
          cache-scope: talqo

  docs:
    name: Publish docs
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: ${{ inputs.version == 'dev' && '1' || '0' }}
          persist-credentials: false
      - name: Recheck release order
        if: inputs.version != 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: bash scripts/release.sh validate "$RELEASE_VERSION"
      - name: Image repository
        id: repository
        env:
          OWNER: ${{ github.repository_owner }}
        run: printf 'image=ghcr.io/%s/talqo-docs\n' "${OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Publish
        id: publish
        uses: ./.github/actions/publish-image
        with:
          image: ${{ steps.repository.outputs.image }}
          file: apps/docs/Dockerfile
          version: ${{ inputs.version }}
          cache-scope: talqo-docs
