name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      run-e2e:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  actions-check:
    name: Actions check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          online-audits: false
          version: 1.29.0

  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Run quality checks
        run: |
          bun run quality
          shellcheck -x -P SCRIPTDIR scripts/*.sh

  dead-code:
    name: Dead code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Detect dead code
        run: bun run knip

  contracts:
    name: Generated contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Check generated API contracts
        run: bun run contracts:check

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Run type checks
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Run tests
        run: bun run test

  i18n:
    name: I18n
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Check translations
        run: bun run i18n

  integration-test:
    name: Integration Test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Run integration tests
        run: bun run test:integration

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Build applications
        run: bun run build

  e2e:
    name: Browser E2E
    if: inputs.run-e2e || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun dependencies
        uses: ./.github/actions/setup-bun
      - name: Install Chromium
        working-directory: apps/e2e
        run: bunx playwright install --with-deps chromium
      - name: Run browser journeys
        run: bun run e2e
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7
