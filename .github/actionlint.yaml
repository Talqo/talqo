paths:
  .github/workflows/*.yml:
    ignore:
      # Remove when actionlint knows the GA runner: https://github.com/rhysd/actionlint/issues/682
      - '^label "ubuntu-26\.04" is unknown\.'
  .github/workflows/release.yml:
    ignore:
      - '^label "ubuntu-26\.04" is unknown\.'
      # Remove when actionlint supports native queuing: https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\.'
  .github/workflows/cd.yml:
    ignore:
      - '^label "ubuntu-26\.04" is unknown\.'
      # Remove when actionlint supports native queuing: https://github.com/rhysd/actionlint/issues/657
      - '^unexpected key "queue" for "concurrency" section\.'
