<!doctype html>
<html>
	<body>
		<p>host text</p>
		<script>
			const params = new URLSearchParams(location.search)
			const script = document.createElement("script")
			script.src = "/widget.js"
			script.async = true
			script.dataset.talqoEmbedToken = params.get("token")
			script.dataset.talqoApi = params.get("api")
			if (params.has("tools"))
				script.addEventListener("load", async () => {
					const { mountTools } = await import("/client-tools.js")
					mountTools()
				})
			document.body.append(script)
		</script>
	</body>
</html>
