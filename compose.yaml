services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.35.0
    ports:
      - target: 5001
        host_ip: 127.0.0.1

  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: talqo
      POSTGRES_PASSWORD: talqo
      POSTGRES_USER: talqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_interval: 1s
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-test:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    profiles: [test]
    environment:
      POSTGRES_DB: talqo
      POSTGRES_PASSWORD: talqo
      POSTGRES_USER: talqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_interval: 1s
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 3
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres-data:
