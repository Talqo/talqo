services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_DB: talqo
      POSTGRES_PASSWORD: talqo
      POSTGRES_USER: talqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - target: 5432
        published: ${POSTGRES_HOST_PORT:-5432}
        host_ip: 127.0.0.1
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql

  postgres-test:
    image: postgres:18.4
    profiles: [test]
    environment:
      POSTGRES_DB: talqo
      POSTGRES_PASSWORD: talqo
      POSTGRES_USER: talqo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    shm_size: 128mb
    tmpfs:
      - /var/lib/postgresql

volumes:
  postgres-data:
